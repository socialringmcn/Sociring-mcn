<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>콘텐츠사업팀 대시보드</title>
<style>
:root{--bg:#F5F6FA;--card:#fff;--text:#14161F;--muted:#6B7185;--line:#E4E7EF;--pri:#5B5BF0;--bad:#E5484D}
@media (prefers-color-scheme:dark){:root{--bg:#0E1016;--card:#171A23;--text:#ECEEF4;--muted:#9AA0B2;--line:#2A2F3D;--pri:#8484FF;--bad:#FF6B6F}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:16px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 28px;text-align:center}
.ic{width:52px;height:52px;border-radius:16px;margin:0 auto 16px;display:grid;place-items:center;background:linear-gradient(135deg,#5B5BF0,#8B5CF6);color:#fff;font-size:24px}
h1{font-size:20px;margin:0 0 6px}p{margin:0 0 20px;color:var(--muted);font-size:14px}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--text)}
input:focus{outline:2px solid var(--pri);border-color:transparent}
button{width:100%;margin-top:12px;font:inherit;font-weight:700;font-size:15px;padding:12px;border:0;border-radius:12px;background:var(--pri);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
label{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
</style></head><body>
<form class="box" id="f">

  <h1>콘텐츠사업팀 대시보드</h1>
  <p>내부 관계자 전용입니다. 비밀번호를 입력해 주세요.</p>
  <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" autofocus>
  <button id="go">입장하기</button>
  <label><input type="checkbox" id="rem"> 이 기기에서 30일간 기억하기</label>
  <div class="err" id="err"></div>
</form>

const RK = "csb_dash_key_v1";
const d64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const e64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
async function derive(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt:d64(P.s), iterations:P.n, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, true, ["decrypt"]);
}
async function unlock(key){
  const buf = await crypto.subtle.decrypt({ name:"AES-GCM", iv:d64(P.i) }, key, d64(P.c));
  const html = new TextDecoder("utf-8").decode(buf);
  document.open(); document.write(html); document.close();
}
(async () => {                       // 기억된 기기면 바로 열기
  try{
    const r = JSON.parse(localStorage.getItem(RK) || "null");
    if (r && r.exp > Date.now() && r.salt === P.s){
      const k = await crypto.subtle.importKey("raw", d64(r.k), "AES-GCM", true, ["decrypt"]);
      await unlock(k); return;
    }
  }catch(e){ try{ localStorage.removeItem(RK); }catch(_){} }
})();
document.getElementById("f").onsubmit = async ev => {
  ev.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "확인 중…"; err.textContent = "";
  try{
    const key = await derive(document.getElementById("pw").value);
    if (document.getElementById("rem").checked){
      try{ localStorage.setItem(RK, JSON.stringify({ k:e64(await crypto.subtle.exportKey("raw", key)), salt:P.s, exp:Date.now()+30*864e5 })); }catch(_){}
    }
    await unlock(key);
  }catch(e){
    err.textContent = "비밀번호가 올바르지 않습니다.";
    btn.disabled = false; btn.textContent = "입장하기";
  }
};
